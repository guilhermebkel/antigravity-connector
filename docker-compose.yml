# Local run from this repository: builds the image and publishes the API and MCP port on 127.0.0.1 only.
# The named volumes keep the agy login (agy-gemini) and the call log (agy-data) across restarts and recreates.
# Keep them: `docker compose down` without -v. The VPS install does not use this file (see the README).
services:
  antigravity-connector:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: antigravity-connector:local
    container_name: antigravity-connector
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - agy-gemini:/home/agy/.gemini
      - agy-data:/data
    restart: unless-stopped

volumes:
  agy-gemini:
  agy-data:
