name: Bug
description: Something does not work as the product or the docs say.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste the API key, a token, a prompt, a login link or the value of an environment variable.** Describe the shape ("a chat call that returns an empty answer") or use invented data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What was done and what was seen: the route or tool called and its reply.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: Cite the ADR, the standard or the glossary term when there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps with test or invented data. Say if it was not reproduced yet.
  - type: dropdown
    id: run-mode
    attributes:
      label: How the server runs
      description: How the server was started.
      options:
        - Docker (docker compose)
        - Local build with the fake agy
        - Local build with the real agy
        - Not known
    validations:
      required: true
  - type: input
    id: agy-version
    attributes:
      label: agy version
      description: The output of `agy --version`, when known.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The log lines of the server (metadata only), the commit and the shapes of the replies. No secrets and no prompts.
  - type: textarea
    id: suspected-cause
    attributes:
      label: Suspected cause and where to look
      description: Files and hypotheses, marked as hypotheses.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The failing case becomes a test; say which one.
    validations:
      required: true
  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      placeholder: none
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue has no API key, token, prompt, login link or other secret.
          required: true
